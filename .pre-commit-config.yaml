# Версии (rev) должны совпадать с версиями в [dependency-groups].dev в pyproject.toml
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        name: ruff (lint)
      - id: ruff-format
        name: ruff (format check)
        args: [--check, --diff]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        name: mypy (strict)
        # Убираем дефолтный --ignore-missing-imports хука: настройки берутся из pyproject.toml
        args: []
