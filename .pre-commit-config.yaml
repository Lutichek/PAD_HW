# Версия Ruff совпадает с версией в [dependency-groups].dev в pyproject.toml
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        name: ruff (lint)
      - id: ruff-format
        name: ruff (format check)
        args: [--check, --diff]

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: bash -c 'exec "${UV_PROJECT_ENVIRONMENT:-.venv}/bin/python" -m mypy'
        language: system
        types: [python]
        pass_filenames: false
