name: pad-hw

services:
  # S3-совместимое хранилище
  s3:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is not set, see .env.example}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is not set, see .env.example}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${S3_PORT:-9000}:9000"          # S3 API
      - "${S3_CONSOLE_PORT:-9001}:9001"  # веб-консоль: /rustfs/console/
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # Одноразовый контейнер: создаёт бакет, если его ещё нет, и завершается
  s3-init:
    image: amazon/aws-cli:2.39.6
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is not set, see .env.example}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is not set, see .env.example}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is not set, see .env.example}
      MLFLOW_BUCKET: ${MLFLOW_BUCKET:-mlflow}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ "$$S3_BUCKET" = "$$MLFLOW_BUCKET" ]; then
          echo "S3_BUCKET and MLFLOW_BUCKET must be different" >&2
          exit 1
        fi
        for bucket in "$$S3_BUCKET" "$$MLFLOW_BUCKET"; do
          if ! aws --endpoint-url http://s3:9000 s3api head-bucket --bucket "$$bucket"; then
            aws --endpoint-url http://s3:9000 s3api create-bucket --bucket "$$bucket"
          fi
        done
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    depends_on:
      s3-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is not set, see .env.example}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is not set, see .env.example}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      MLFLOW_S3_ENDPOINT_URL: http://s3:9000
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,localhost:*,127.0.0.1:*"
    entrypoint: ["mlflow", "server"]
    command:
      - --host=0.0.0.0
      - --port=5000
      - --workers=1
      - --backend-store-uri=sqlite:////tracking/mlflow.db
      - --serve-artifacts
      - --artifacts-destination=s3://${MLFLOW_BUCKET:-mlflow}/
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-db:/tracking
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 30

  trainer:
    profiles: ["training"]
    build:
      context: .
      args:
        PAD_GIT_COMMIT: ${PAD_GIT_COMMIT:-}
        PAD_GIT_DIRTY: ${PAD_GIT_DIRTY:-}
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is not set, see .env.example}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is not set, see .env.example}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is not set, see .env.example}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: http://s3:9000
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - training-cache:/app/data/cache
      - ./outputs:/app/outputs

  triton:
    profiles: ["serving"]
    image: nvcr.io/nvidia/tritonserver:26.09-py3
    command: ["tritonserver", "--model-repository=/models"]
    volumes:
      - ./model_repository:/models:ro
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v2/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    profiles: ["serving"]
    build:
      context: .
      dockerfile: Dockerfile.serving
    depends_on:
      triton:
        condition: service_healthy
    environment:
      TRITON_URL: http://triton:8000
      TRITON_MODEL: cifar_cnn
      TRITON_MODEL_VERSION: "1"
      STATS_PATH: /serving/stats.json
    volumes:
      - ./data/serving:/serving:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8080/health', timeout=3).close()"]
      interval: 3s
      timeout: 4s
      retries: 20

volumes:
  s3-data:
  mlflow-db:
  training-cache:
