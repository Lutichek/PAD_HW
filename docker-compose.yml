name: pad-hw

services:
  # S3-совместимое хранилище
  s3:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is not set, see .env.example}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is not set, see .env.example}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${S3_PORT:-9000}:9000"          # S3 API
      - "${S3_CONSOLE_PORT:-9001}:9001"  # веб-консоль: /rustfs/console/
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # Одноразовый контейнер: создаёт бакет, если его ещё нет, и завершается
  s3-init:
    image: amazon/aws-cli:2.39.6
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is not set, see .env.example}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is not set, see .env.example}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is not set, see .env.example}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if aws --endpoint-url http://s3:9000 s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null; then
          echo "Bucket $$S3_BUCKET already exists"
        else
          aws --endpoint-url http://s3:9000 s3api create-bucket --bucket "$$S3_BUCKET"
          echo "Bucket $$S3_BUCKET created"
        fi
    restart: "no"

volumes:
  s3-data:
